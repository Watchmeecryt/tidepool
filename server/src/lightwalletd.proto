syntax = "proto3";
package cash.z.wallet.sdk.rpc;
message ChainSpec {}
message BlockID { uint64 height = 1; bytes hash = 2; }
message Empty {}
message LightdInfo { string version = 1; string vendor = 2; bool taddrSupport = 3; string chainName = 4; uint64 saplingActivationHeight = 5; string consensusBranchId = 6; uint64 blockHeight = 7; string gitCommit = 8; string branch = 9; string buildDate = 10; string buildUser = 11; uint64 estimatedHeight = 12; string zcashdBuild = 13; string zcashdSubversion = 14; }
message GetAddressUtxosArg { repeated string addresses = 1; uint64 startHeight = 2; uint32 maxEntries = 3; }
message GetAddressUtxosReply { bytes txid = 1; int32 index = 2; bytes script = 3; int64 valueZat = 4; uint64 height = 5; string address = 6; }
message GetAddressUtxosReplyList { repeated GetAddressUtxosReply addressUtxos = 1; }
message RawTransaction { bytes data = 1; uint64 height = 2; }
message SendResponse { int32 errorCode = 1; string errorMessage = 2; }
message BlockID2 { uint64 height = 1; bytes hash = 2; }
message TxFilter { BlockID block = 1; uint64 index = 2; bytes hash = 3; }
service CompactTxStreamer {
  rpc GetLatestBlock(ChainSpec) returns (BlockID);
  rpc GetLightdInfo(Empty) returns (LightdInfo);
  rpc SendTransaction(RawTransaction) returns (SendResponse);
  rpc GetTransaction(TxFilter) returns (RawTransaction);
  rpc GetAddressUtxos(GetAddressUtxosArg) returns (GetAddressUtxosReplyList);
}
